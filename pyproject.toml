[project]
name = "secreton-api-client"
description = "Official Python client for Secreton API - Speech-To-Text and Summarization service"
readme = "README.md"
authors = [
    { name = "saner99", email = "it@saner99.ru" }
]
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
]

keywords = ["secreton", "api", "client", "document", "processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://secreton.ru"
Documentation = "https://docs.secreton.ru"
Repository = "https://secreton.ru"
Issues = "https://secreton.ru/issues"

[project.scripts]
secreton_api_client = "secreton_api_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "coverage>=7.10.6",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "respx>=0.22.0",
]

[tool.hatch.version]
path = "src/secreton_api_client/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100